<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 240" width="100%" height="100%">
  <defs>
    <linearGradient id="vyapar-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#080D1A"/>
    </linearGradient>
    <linearGradient id="pwa-badge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: "JetBrains Mono", "Fira Code", monospace; }
  </style>

  <!-- Container -->
  <rect width="960" height="240" rx="12" fill="url(#vyapar-bg)" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Header -->
  <g transform="translate(32, 28)">
    <text x="0" y="0" fill="#10B981" font-size="12" font-weight="700" letter-spacing="1.5" class="font-mono">PWA ARCHITECTURE • REAL-TIME UDHAAR RECONCILIATION</text>
    <text x="0" y="24" fill="#F8FAFC" font-size="20" font-weight="700" class="font-sans">VyaparAI CFO Dual-Persona Ledger System</text>
    <text x="640" y="24" fill="#6EE7B7" font-size="12" font-weight="600" class="font-mono">● VITE 6 • REACT 19 • PWA</text>
  </g>

  <!-- Dual Cards -->
  <!-- Persona 1: Shopkeeper -->
  <g transform="translate(32, 80)">
    <rect width="420" height="125" rx="8" fill="#111827" stroke="#1F2937" stroke-width="1.2"/>
    <rect x="0" y="0" width="420" height="26" rx="8" fill="#1E293B"/>
    <text x="14" y="17" fill="#6EE7B7" font-size="11" font-weight="700" class="font-mono">SHOPKEEPER PORTAL (ADMIN)</text>
    <text x="14" y="48" fill="#E2E8F0" font-size="13" font-weight="600" class="font-sans">Digital Credit Ledger &amp; QR Onboarding</text>
    <text x="14" y="68" fill="#94A3B8" font-size="11" class="font-sans">• Instant QR generation for paperless customer linkage</text>
    <text x="14" y="86" fill="#94A3B8" font-size="11" class="font-sans">• Credit limits, balance caps, and overdue reminders</text>
    <text x="14" y="104" fill="#94A3B8" font-size="11" class="font-sans">• Client-side PDF statement compilation (jsPDF + autoTable)</text>
  </g>

  <!-- Synchronization Core -->
  <g transform="translate(468, 120)">
    <circle cx="12" cy="12" r="16" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
    <text x="12" y="16" text-anchor="middle" fill="#10B981" font-size="10" font-weight="700" class="font-mono">SYNC</text>
  </g>

  <!-- Persona 2: Customer -->
  <g transform="translate(508, 80)">
    <rect width="420" height="125" rx="8" fill="#111827" stroke="#1F2937" stroke-width="1.2"/>
    <rect x="0" y="0" width="420" height="26" rx="8" fill="#1E293B"/>
    <text x="14" y="17" fill="#93C5FD" font-size="11" font-weight="700" class="font-mono">CUSTOMER PORTAL (UDHAARIST)</text>
    <text x="14" y="48" fill="#E2E8F0" font-size="13" font-weight="600" class="font-sans">Aggregated Credit &amp; Proof Verification</text>
    <text x="14" y="68" fill="#94A3B8" font-size="11" class="font-sans">• Multi-store outstanding liability dashboard</text>
    <text x="14" y="86" fill="#94A3B8" font-size="11" class="font-sans">• Direct transaction history with chat receipt proofs</text>
    <text x="14" y="104" fill="#94A3B8" font-size="11" class="font-sans">• Secure online settlement integration &amp; receipt downloads</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 140" width="100%" height="100%">
  <defs>
    <linearGradient id="matrix-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: "JetBrains Mono", "Fira Code", monospace; }
  </style>

  <rect width="960" height="140" rx="10" fill="url(#matrix-bg)" stroke="#1F2937" stroke-width="1.2"/>

  <!-- Row 1: Domain Labels -->
  <g transform="translate(36, 26)">
    <text x="0" y="0" fill="#64748B" font-size="11" font-weight="700" letter-spacing="1.2" class="font-mono">CORE RUNTIME</text>
    <text x="240" y="0" fill="#64748B" font-size="11" font-weight="700" letter-spacing="1.2" class="font-mono">FRONTEND ARCHITECTURE</text>
    <text x="500" y="0" fill="#64748B" font-size="11" font-weight="700" letter-spacing="1.2" class="font-mono">BACKEND &amp; ORM</text>
    <text x="730" y="0" fill="#64748B" font-size="11" font-weight="700" letter-spacing="1.2" class="font-mono">TESTING &amp; STORAGE</text>
  </g>

  <!-- Row 2: Technologies -->
  <g transform="translate(36, 62)">
    <!-- Group 1 -->
    <text x="0" y="0" fill="#F8FAFC" font-size="14" font-weight="600" class="font-sans">TypeScript (Strict)</text>
    <text x="0" y="24" fill="#94A3B8" font-size="12" class="font-mono">Node.js • ES2024</text>

    <!-- Group 2 -->
    <text x="240" y="0" fill="#F8FAFC" font-size="14" font-weight="600" class="font-sans">Next.js 15 • React 19</text>
    <text x="240" y="24" fill="#94A3B8" font-size="12" class="font-mono">Tailwind v4 • TanStack Query</text>

    <!-- Group 3 -->
    <text x="500" y="0" fill="#F8FAFC" font-size="14" font-weight="600" class="font-sans">NestJS 11 • Prisma 6/7</text>
    <text x="500" y="24" fill="#94A3B8" font-size="12" class="font-mono">Server Actions • REST</text>

    <!-- Group 4 -->
    <text x="730" y="0" fill="#F8FAFC" font-size="14" font-weight="600" class="font-sans">Vitest • Playwright</text>
    <text x="730" y="24" fill="#94A3B8" font-size="12" class="font-mono">PostgreSQL • Supabase</text>
  </g>

  <!-- Accent Points -->
  <circle cx="215" cy="70" r="2" fill="#3B82F6"/>
  <circle cx="475" cy="70" r="2" fill="#3B82F6"/>
  <circle cx="705" cy="70" r="2" fill="#3B82F6"/>
</svg>
